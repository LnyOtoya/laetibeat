[package]
name = "rust_lib_laetibeat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
laetibeat_core = { path = "../../laetibeat_core" }
laetibeat_remote = { path = "../../laetibeat_remote" }
laetibeat_lx = { path = "../../laetibeat_lx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# 桌面原生文件选择框；移动端由 Flutter 原生选择器处理
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rfd = "0.15"

# 桌面日志输出（Android 走 logcat）。默认 info，可用 RUST_LOG 覆盖。
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7.1"
