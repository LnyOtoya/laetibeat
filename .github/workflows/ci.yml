name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libdbus-1-dev \
            libssl-dev \
            libwayland-dev \
            pkg-config

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Flutter pub get
        working-directory: laetibeat_flutter
        run: flutter pub get

      # 当前基线还有既有 warning/info；先只阻止 error 进入 CI。
      - name: Flutter analyze
        working-directory: laetibeat_flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: laetibeat_flutter
        run: flutter test --no-pub

      - name: Rust test
        run: cargo test --workspace

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: laetibeat_musicapi_host/go.sum

      - name: Go test
        working-directory: laetibeat_musicapi_host
        run: go test ./...

      - name: Build Linux host matrix
        working-directory: laetibeat_musicapi_host
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "-s -w" \
              -o "/tmp/laetibeat_musicapi_host-linux-${arch}" .
            file "/tmp/laetibeat_musicapi_host-linux-${arch}"
          done

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;28.2.13676358"

      - name: Build Android host matrix
        working-directory: laetibeat_musicapi_host
        run: |
          set -euo pipefail
          NDK="${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="${NDK}/aarch64-linux-android24-clang" \
            go build -buildmode=pie -trimpath -ldflags "-s -w" \
            -o /tmp/laetibeat_musicapi_host-android-arm64 .
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC="${NDK}/armv7a-linux-androideabi24-clang" \
            go build -buildmode=pie -trimpath -ldflags "-s -w" \
            -o /tmp/laetibeat_musicapi_host-android-armv7 .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="${NDK}/x86_64-linux-android24-clang" \
            go build -buildmode=pie -trimpath -ldflags "-s -w" \
            -o /tmp/laetibeat_musicapi_host-android-x86_64 .
          file /tmp/laetibeat_musicapi_host-android-*
