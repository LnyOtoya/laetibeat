name: CI

on:
  push:
    branches:
      - main
      - native
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libdbus-1-dev \
            libssl-dev \
            libwayland-dev \
            pkg-config

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Flutter pub get
        working-directory: laetibeat_flutter
        run: flutter pub get

      # 当前基线还有既有 warning/info；先只阻止 error 进入 CI。
      - name: Flutter analyze
        working-directory: laetibeat_flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: laetibeat_flutter
        run: flutter test --no-pub

      - name: Rust test
        run: cargo test --workspace

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Linux Rust online hosts
        run: |
          set -euo pipefail
          cargo build --release -p laetibeat_qq_host -p laetibeat_netease_host
          file target/release/laetibeat_qq_host target/release/laetibeat_netease_host

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;28.2.13676358"

      - name: Build Android Rust online host matrix
        run: |
          set -euo pipefail
          NDK="${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for spec in \
            "aarch64-linux-android:aarch64_linux_android:aarch64-linux-android24-clang:16384" \
            "armv7-linux-androideabi:armv7_linux_androideabi:armv7a-linux-androideabi24-clang:4096" \
            "x86_64-linux-android:x86_64_linux_android:x86_64-linux-android24-clang:16384"; do
            IFS=: read -r target env_suffix clang page_size <<< "${spec}"
            export "CC_${env_suffix}=${NDK}/${clang}"
            export "AR_${env_suffix}=${NDK}/llvm-ar"
            export "RANLIB_${env_suffix}=${NDK}/llvm-ranlib"
            export "CARGO_TARGET_$(echo "${target}" | tr '[:lower:]-' '[:upper:]_')_LINKER=${NDK}/${clang}"
            RUSTFLAGS="-C strip=symbols -C link-arg=-Wl,-z,max-page-size=${page_size}" \
              cargo build --release -p laetibeat_qq_host -p laetibeat_netease_host --target "${target}"
          done
          file target/*/release/laetibeat_qq_host target/*/release/laetibeat_netease_host
