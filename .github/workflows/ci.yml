name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Flutter pub get
        working-directory: laetibeat_flutter
        run: flutter pub get

      # 当前基线还有既有 warning/info；先只阻止 error 进入 CI。
      - name: Flutter analyze
        working-directory: laetibeat_flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: laetibeat_flutter
        run: flutter test --no-pub

      - name: Rust test
        run: cargo test --workspace
