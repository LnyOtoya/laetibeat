[package]
name = "laetibeat_netease"
version = "0.1.0"
edition = "2021"
description = "Self-hosted NetEase Cloud Music Node API client for Laetibeat"
license = "MIT"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
